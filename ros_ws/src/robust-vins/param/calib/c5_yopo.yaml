# YOPO C5 camera-IMU calibration for far_vins (SchurVINS)
# Camera: RealSense D435i infrared stereo, 640x480, image_rect_raw (undistorted)
# IMU:    PX4 BMI055 via /mavros/imu/data_raw
#
# T_B_C (camera-IMU extrinsics): from FALCON c5.yaml — properly calibrated,
#   stereo baseline = 50.1mm (matches D435i hardware spec).
#   The YOPO d435i_yopo.yaml extrinsics were only initial guesses (estimate_extrinsic=1),
#   yielding a wrong 29.7mm baseline that breaks stereo triangulation.
#
# Intrinsics: D435i factory rectification params for 640x480 (from d435i_left.yaml).
#   848x480 and 640x480 use different sensor binning — NOT a simple linear scale.
#   NOTE: for best accuracy, re-run Kalibr calibration on this machine.

label: Kalibr
id: yopo_c5_640x480
cameras:
- camera:
    label: cam0
    id: yopo_c5_cam0
    line-delay-nanoseconds: 0
    image_height: 480
    image_width: 640
    type: pinhole
    intrinsics:
      cols: 1
      rows: 4
      # D435i factory rectification params at 640x480 (from d435i_left.yaml)
      data: [384.39654541015625, 384.39654541015625, 323.3316345214844, 234.95498657226562]
    distortion:
      type: radial-tangential
      parameters:
        cols: 1
        rows: 4
        # Zero distortion — image_rect_raw is already undistorted by RealSense SDK
        data: [0.0, 0.0, 0.0, 0.0]
  T_B_C:
    cols: 4
    rows: 4
    # From FALCON c5.yaml — baseline 50.1mm, correctly calibrated
    data: [-0.01667710230546453, -0.005752374038511693, 0.9998443801170342, 0.06620339268865669,
           -0.9998106445226181,   0.01012460048650078, -0.016618290052160232, 0.007123700286756258,
           -0.010027430277097515,-0.9999321990304701, -0.0059201337930948365, -0.02355844739372723,
            0.0, 0.0, 0.0, 1.0]
- camera:
    label: cam1
    id: yopo_c5_cam1
    line-delay-nanoseconds: 0
    image_height: 480
    image_width: 640
    type: pinhole
    intrinsics:
      cols: 1
      rows: 4
      # D435i factory rectification params at 640x480 (from d435i_right.yaml)
      data: [384.39654541015625, 384.39654541015625, 323.3316345214844, 234.95498657226562]
    distortion:
      type: radial-tangential
      parameters:
        cols: 1
        rows: 4
        data: [0.0, 0.0, 0.0, 0.0]
  T_B_C:
    cols: 4
    rows: 4
    # From FALCON c5.yaml — baseline 50.1mm, correctly calibrated
    data: [-0.016564569977563108, -0.004361460667099066, 0.9998532855785933, 0.06536428229221496,
           -0.9998122500542875,    0.010127374126983793,-0.0165197135167436, -0.04298394148842852,
           -0.010053838214413401, -0.9999392051290625, -0.004528397400511048, -0.024120122747162624,
            0.0, 0.0, 0.0, 1.0]

imu_params:
  # delay_imu_cam = -td_vins = -(-0.0109) = 0.0109 s
  # Convention: effective_cam_t = t_cam - delay_imu_cam
  # (matches Kalibr td = -0.01090 s from d435i_yopo.yaml)
  delay_imu_cam: 0.0109
  max_imu_delta_t: 0.01
  acc_max: 176.0
  omega_max: 17.0
  # Noise params from d435i_yopo.yaml (PX4 BMI055)
  sigma_acc_c: 0.1        # acc_n in VINS-Fusion
  sigma_omega_c: 0.01     # gyr_n in VINS-Fusion
  sigma_omega_bias_c: 0.0001  # gyr_w in VINS-Fusion
  sigma_acc_bias_c: 0.001     # acc_w in VINS-Fusion
  sigma_integration: 0.0
  g: 9.805                # g_norm from d435i_yopo.yaml
  imu_rate: 200

imu_initialization:
  velocity: [0.0, 0.0, 0.0]
  omega_bias: [0.0, 0.0, 0.0]
  acc_bias: [0.0, 0.0, 0.0]
  velocity_sigma: 2.0
  omega_bias_sigma: 0.01
  acc_bias_sigma: 0.1
